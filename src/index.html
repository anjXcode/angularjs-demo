<!DOCTYPE html>
<html lang="en" ng-app="myApp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AngularJS Notes</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Simple styling to match reference image -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body ng-controller="MainController">

    <div class="content-box">
        
        <!-- Top Circle Symbol -->
        <div class="logo-circle">○</div>

        <!-- Name, Title, and Bio (fetched from data.json) -->
        <div class="person-name">{{ profile.name }}</div>
        <div class="person-role">{{ profile.role }}</div>
        <div class="person-bio">{{ profile.bio }}</div>

        <!-- Loop through each Year section -->
        <div ng-repeat="section in sections" class="mb-5">
            
            <!-- Year Heading (e.g., 2026, 2025) -->
            <div class="year-title">{{ section.year }}</div>

            <!-- Loop through each note/post in that year -->
            <div ng-repeat="item in section.items" class="item-row">
                <span class="item-date">{{ item.date }}</span>
                <span class="item-title">{{ item.title }}</span>
            </div>

        </div>

    </div>

    <!-- 1. Load AngularJS -->
    <script src="lib/angular/angular.js"></script>

    <!-- 2. Load our simple JavaScript -->
    <script src="js/app.js"></script>

</body>
</html>
